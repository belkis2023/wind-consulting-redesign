<div class="relative w-full xs:w-[360px] h-[310px] sm:w-[360px] sm:h-[360px]
  xs:h-[340px]
bg-[#026ba5]/90 rounded-2xl shadow-lg
  text-left md:h-[350px] md:w-[350px] mlg:h-[400px] mlg:w-[390px]
  xl:!h-[430px] xl:!w-[430px]">
  <!-- Background Image Layer -->
  <div class="absolute inset-x-0 bottom-0 h-1/2 bg-bottom opacity-90 blur-[0.5px]"
    style="background-image: url('/public/background-images/generic-background/background1.svg');

          -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 1), transparent);
          mask-image: linear-gradient(to top, rgba(0, 0, 0, 1), transparent);">
  </div>

  <div class="relative flex h-full !w-full flex-col justify-around px-6 py-4  z-10">
    <!-- Content Layer -->
    <div>
      <h1 class="text-2xl sm:text-3xl !tracking-wider font-bold md:ml-5 mb-4 text-white">
        Progrès innovant
      </h1>
      <p class="text-sm xs:text-[15px] tracking-wide md:text-[17px] mlg:text-lg mt-4 lg:!mt-8 md:!px-5 whitespace-normal text-white" style="line-height: 1.5 !important;">
        Wind Consulting vous accompagne pour innover et progresser durablement grâce à des solutions digitales sur mesure
        alliant performance et agilité.
      </p>
    </div>
      <!--button -->
    <div class="relative w-full md:ml-5 flex justify-center md:justify-start md:text-left">
      <app-button-with-background
        backgroundImageUrl="/public/background-images/generic-background/background1-with-more-fill.svg" label="Nous Rejoindre"
        icon="arrow-up-right" width="w-60 xs:w-[clamp(15rem,75vw,20rem)] sm:w-72 md:w-48" height="h-10" [strokeWidth]="2" strokeColor="stroke-links-blue"
        textColor="text-links-blue" [logo]="true" whichLogo="logoBlue" backgroundPosition="bottom" logoSize="size-10"
        bgColor="bg-white" imageOpacity="opacity-100">
      </app-button-with-background>
    </div>

  </div>


</div>
