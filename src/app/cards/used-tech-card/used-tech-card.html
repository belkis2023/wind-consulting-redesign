<div #card class="px-4 py-6 w-[90vw] xs:w-[310px] sm:w-[380px] h-52 xl:w-[360px] xl:h-54
                          flex flex-col items-center gap-4 bg-[#EAF6FD] specialFont shadowCustom rounded-3xl">
  <div class="w-full flex top-0 justify-start" >
    <app-generic-title size="xsmall">Les Technologies</app-generic-title>
  </div>
  <div class="flex gap-2 text-xs text-links-blue flex-wrap">
    <app-button-with-background *ngFor="let tech of visibleTechs"
      [leftIcon]="tech.name"
      [textColor]="'text-links-blue'"
      [label]="tech.name"
      [bgColor]="'bg-white'" [iconBgColor]="'used-tech-icon-gradient'" [strokeColor]="'white'" fillColor="white"
                                height="h-7" width="min-w-28 !max-w-full"
    >
    </app-button-with-background>
  </div>
</div>
