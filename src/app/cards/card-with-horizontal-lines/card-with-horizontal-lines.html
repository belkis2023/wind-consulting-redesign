<div #newsCard class="flex flex-col h-[490px] sm:h-96 w-[90vw] md:w-full">
  <app-line-wrapper>
    <div class="flex flex-col z-0 sm:flex-row gap-4 sm:gap-8 h-[285px] sm:h-32">
      <!-- here we have the news image -->
      <app-client-card cardBackgroundImage="/public/background-images/cards/news/news1.jpg"
      ></app-client-card>

      <!-- here we have the news text -->
      <div class="text-links-blue text-sm sm:text-lg
                   line-clamp-4"
          style="line-height: 1.6">
        {{ newsText }}
      </div>
    </div>
  </app-line-wrapper>
  <!-- here we're gonna have the button to go to that news page -->
  <div class="flex justify-end -mt-6">
    <app-circular-button icon="arrow-up-right" [outline]="true" outlineColor="border-wind-blue"></app-circular-button>
  </div>

</div>
